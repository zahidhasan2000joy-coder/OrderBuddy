name: Build Paircart APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Strip Git Metadata Before APK Build
        run: rm -rf .git

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Signing Keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Run Unit Tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build Release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Prepare Paircart APK Output
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Paircart.apk
          ls -lh dist/Paircart.apk

      - name: Upload Paircart APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Paircart-APK
          path: dist/Paircart.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v10.0-build-${{ github.run_number }}
          name: Paircart v10.0 (Build #${{ github.run_number }})
          body: |
            Official Paircart Release APK built automatically via GitHub Actions.
            Download **Paircart.apk** from the Assets section below.
          files: dist/Paircart.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
